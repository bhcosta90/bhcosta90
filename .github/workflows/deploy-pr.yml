name: 🔎 PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]

jobs:
  deploy-preview:
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      (startsWith(github.head_ref, 'feature/') ||
       startsWith(github.head_ref, 'release/') ||
       startsWith(github.head_ref, 'hotfix/') ||
       startsWith(github.head_ref, 'bugfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      #- name: Run Laravel Tests
      #  uses: ./.github/actions/laravel-tests

      - name: Sanitize branch name
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" | sed 's/\//-/g')
          echo "BRANCH_SLUG=$BRANCH_SLUG" >> $GITHUB_ENV

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Prepare remote dir
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}"

      - name: 📤 Transfer preview.sh
        run: |
          scp .github/deploy/preview.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}/deploy-preview.sh
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "chmod +x /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}/deploy-preview.sh"

      - name: 🚀 Open / refresh preview
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }} && ./deploy-preview.sh open '${{ env.BRANCH_SLUG }}' '${{ github.head_ref }}' '${{ github.event.pull_request.head.sha }}'"

      - name: 💬 Comment preview URL on PR
        if: success() && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review')
        uses: actions/github-script@v7
        with:
          script: |
            const branchSlug = process.env.BRANCH_SLUG;
            const repo = context.repo.repo;
            const url = `http://${branchSlug}-preview.${repo}.bhcosta90.dev.br`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview pronto!**\n\n🔗 ${url}\n\n_Ambiente será removido automaticamente ao fechar o PR._`
            });

      - name: 💬 Comment failure on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const branchSlug = process.env.BRANCH_SLUG || '${{ github.head_ref }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Falha no deploy do preview**\n\nBranch: \`${branchSlug}\`\n\n[Ver logs do workflow](${runUrl})`
            });

  cleanup-preview:
    if: |
      (github.event.action == 'closed' || github.event.action == 'converted_to_draft') &&
      (startsWith(github.head_ref, 'feature/') ||
       startsWith(github.head_ref, 'release/') ||
       startsWith(github.head_ref, 'hotfix/') ||
       startsWith(github.head_ref, 'bugfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Sanitize branch name
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" | sed 's/\//-/g')
          echo "BRANCH_SLUG=$BRANCH_SLUG" >> $GITHUB_ENV

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Prepare remote dir
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}"

      - name: 📤 Transfer preview.sh
        run: |
          scp .github/deploy/preview.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}/deploy-preview.sh
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "chmod +x /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }}/deploy-preview.sh"

      - name: 🧹 Close / destroy preview
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /var/www/${{ github.repository_owner }}/${{ github.event.repository.name }} && ./deploy-preview.sh close '${{ env.BRANCH_SLUG }}'"
